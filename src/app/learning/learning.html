@switch(color){
    @case('red'){
        <h1 style="background-color:red;">Nyekundu</h1>
    }
    @case('blue'){
        <h1 style="background-color:blue;">buluu</h1>

    }@default{
        <h1 style="background-color:black; color:white;">Nyeusi</h1>

    }
}
